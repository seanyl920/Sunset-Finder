name: Deploy to GitHub Pages

# Publishes the app as a free static site at
# https://seanyl920.github.io/Sunset-Finder/
# Spots are switched off in this build (no server / no API key), so the
# "Where to watch" section shows the friendly setup card.

on:
  push:
    branches: [claude/sunset-forecast-discovery-XeslO]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /Sunset-Finder/
          VITE_SPOTS_ENABLED: "false"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
